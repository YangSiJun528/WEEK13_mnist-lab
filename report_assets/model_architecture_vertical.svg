<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" role="img" aria-labelledby="title desc">
  <title id="title">MNIST 분류 모델 구조</title>
  <desc id="desc">입력, 은닉 블록 1, 은닉 블록 2, 출력층, 예측으로 이어지는 세로형 모델 구조입니다.</desc>
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
    .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; }
    .out { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; }
    .pred { fill: #fff7ed; stroke: #f97316; stroke-width: 1.2; }
    .label { fill: #0f172a; font-family: Arial, sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    .small { fill: #475569; font-family: Arial, sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
    .title { fill: #1e293b; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .arrow { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="520" height="820"/>

  <rect class="node" x="145" y="28" width="230" height="54" rx="8"/>
  <text class="label" x="260" y="48">입력</text>
  <text class="small" x="260" y="66">784차원</text>

  <path class="arrow" d="M260 82 V112"/>

  <rect class="group" x="82" y="112" width="356" height="284" rx="10"/>
  <text class="title" x="260" y="142">은닉 블록 1: 512</text>
  <rect class="node" x="145" y="166" width="230" height="44" rx="7"/>
  <text class="label" x="260" y="181">Affine</text>
  <text class="small" x="260" y="198">784 → 512</text>
  <rect class="node" x="145" y="226" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="246">BatchNorm</text>
  <rect class="node" x="145" y="282" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="302">ReLU</text>
  <rect class="node" x="145" y="338" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="358">Dropout</text>

  <path class="arrow" d="M260 210 V226"/>
  <path class="arrow" d="M260 266 V282"/>
  <path class="arrow" d="M260 322 V338"/>
  <path class="arrow" d="M260 378 V408"/>

  <rect class="group" x="82" y="408" width="356" height="284" rx="10"/>
  <text class="title" x="260" y="438">은닉 블록 2: 256</text>
  <rect class="node" x="145" y="462" width="230" height="44" rx="7"/>
  <text class="label" x="260" y="477">Affine</text>
  <text class="small" x="260" y="494">512 → 256</text>
  <rect class="node" x="145" y="522" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="542">BatchNorm</text>
  <rect class="node" x="145" y="578" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="598">ReLU</text>
  <rect class="node" x="145" y="634" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="654">Dropout</text>

  <path class="arrow" d="M260 506 V522"/>
  <path class="arrow" d="M260 562 V578"/>
  <path class="arrow" d="M260 618 V634"/>
  <path class="arrow" d="M260 674 V704"/>

  <rect class="out" x="145" y="704" width="230" height="44" rx="7"/>
  <text class="label" x="260" y="719">Affine</text>
  <text class="small" x="260" y="736">256 → 10</text>
  <path class="arrow" d="M260 748 V764"/>
  <rect class="out" x="145" y="764" width="230" height="40" rx="7"/>
  <text class="label" x="260" y="784">Softmax</text>
  <path class="arrow" d="M375 784 H410"/>
  <rect class="pred" x="410" y="764" width="70" height="40" rx="7"/>
  <text class="label" x="445" y="784">예측</text>
</svg>
